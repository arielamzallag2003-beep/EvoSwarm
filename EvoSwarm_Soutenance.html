<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EvoSwarm — Soutenance</title>
<style>
/* ============================================================
   EvoSwarm — deck de soutenance
   Palette dérivée du jeu : nuit bleu-nuit, espèces = accents.
   ============================================================ */
:root{
  --bg:#070b12;
  --bg2:#0c1220;
  --ink:#eef3fb;
  --muted:#93a3bd;
  --dim:#63728c;
  --line:rgba(140,170,220,.14);
  --card:rgba(255,255,255,.035);
  --grazer:#3ddb6e;
  --darter:#3aa0ff;
  --stalker:#ffab2e;
  --apex:#ff4d4d;
  --accent:#54e0c7;
  --sun:#ffd166;
  --slide-w:1280px;
  --slide-h:720px;
  --f: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
  --mono: 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f);
  overflow:hidden; display:grid; place-items:center;
  -webkit-font-smoothing:antialiased;
}
/* ---------- stage / scaling ---------- */
#stage{
  width:var(--slide-w); height:var(--slide-h);
  position:relative; transform-origin:center center;
}
.slide{
  position:absolute; inset:0;
  padding:64px 78px;
  display:none; flex-direction:column;
  background:
    radial-gradient(1200px 700px at 12% -10%, #16233c 0%, transparent 60%),
    radial-gradient(900px 600px at 110% 110%, #102a2a 0%, transparent 55%),
    linear-gradient(160deg,#080d16 0%, #0a1120 60%, #070b12 100%);
  overflow:hidden;
}
.slide.active{display:flex; animation:slideIn .45s cubic-bezier(.22,.9,.3,1)}
@keyframes slideIn{from{opacity:0; transform:translateY(14px) scale(.995)}to{opacity:1;transform:none}}
.slide::after{ /* grain + vignette */
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%);
}
/* ---------- typography ---------- */
h1{font-size:70px;line-height:1.02;letter-spacing:-2.2px;font-weight:800}
h2{font-size:44px;line-height:1.08;letter-spacing:-1.1px;font-weight:750;margin-bottom:6px}
h3{font-size:23px;font-weight:700;letter-spacing:-.2px}
p,li{font-size:19px;line-height:1.62;color:#cdd8ea}
.lead{font-size:23px;line-height:1.55;color:#dce6f5;max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:15.5px;line-height:1.55}
.mono{font-family:var(--mono)}
strong{color:#fff;font-weight:700}
em{color:var(--accent);font-style:normal;font-weight:600}
/* ---------- chrome ---------- */
.kicker{
  display:inline-flex;align-items:center;gap:10px;
  font-size:12.5px;font-weight:800;letter-spacing:2.4px;text-transform:uppercase;
  color:var(--accent);margin-bottom:16px;
}
.kicker::before{content:"";width:26px;height:2px;background:var(--accent);border-radius:2px}
.who{
  position:absolute;top:60px;right:78px;z-index:3;
  display:flex;align-items:center;gap:9px;
  padding:8px 15px 8px 9px;border-radius:999px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  font-size:13.5px;font-weight:650;color:#dbe6f7;backdrop-filter:blur(8px);
}
.who i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-style:normal;font-size:12px;font-weight:800;color:#04121a}
.who.enzo i{background:linear-gradient(135deg,#3ddb6e,#54e0c7)}
.who.ariel i{background:linear-gradient(135deg,#3aa0ff,#8b7bff)}
.who.theo i{background:linear-gradient(135deg,#ffab2e,#ff6b4d)}
.who.duo i{background:linear-gradient(135deg,#ffab2e,#3aa0ff)}
.foot{
  position:absolute;left:78px;right:78px;bottom:30px;z-index:3;
  display:flex;justify-content:space-between;align-items:center;
  font-size:12.5px;color:var(--dim);letter-spacing:.4px;
}
.dot{width:5px;height:5px;border-radius:50%;background:var(--dim);display:inline-block;margin:0 9px;vertical-align:middle}
/* progress */
#bar{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--darter));z-index:60;transition:width .35s cubic-bezier(.22,.9,.3,1)}
/* ---------- layout helpers ---------- */
.grid{display:grid;gap:22px;flex:1;min-height:0}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g23{grid-template-columns:1.15fr .85fr}
.g32{grid-template-columns:.85fr 1.15fr}
.col{display:flex;flex-direction:column;gap:14px;min-height:0}
.center{align-items:center;justify-content:center;text-align:center}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;
  position:relative;overflow:hidden;
}
.card.tint::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--accent))}
.card h3{margin-bottom:8px}
.card .num{font-size:34px;font-weight:800;letter-spacing:-1px;color:#fff}
.tag{display:inline-block;padding:4px 11px;border-radius:999px;background:rgba(84,224,199,.12);
  border:1px solid rgba(84,224,199,.3);color:var(--accent);font-size:12.5px;font-weight:700;letter-spacing:.3px}
ul{list-style:none;display:flex;flex-direction:column;gap:11px}
ul li{padding-left:22px;position:relative}
ul li::before{content:"";position:absolute;left:0;top:11px;width:7px;height:7px;border-radius:2px;
  background:var(--c,var(--accent));transform:rotate(45deg)}
/* ---------- media ---------- */
.shot{
  border-radius:16px;overflow:hidden;border:1px solid var(--line);
  background:#060a11;position:relative;flex:1;min-height:0;
  box-shadow:0 24px 60px rgba(0,0,0,.55);
}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot figcaption{
  position:absolute;left:0;right:0;bottom:0;padding:26px 20px 13px;
  background:linear-gradient(transparent,rgba(4,8,14,.92));
  font-size:13.5px;color:#c6d4e8;letter-spacing:.2px;
}
/* drop-in placeholder for the shots the team adds later */
.ph{
  flex:1;min-height:0;border-radius:16px;border:1.5px dashed rgba(140,175,225,.28);
  background:
    linear-gradient(135deg,rgba(84,224,199,.05),rgba(58,160,255,.05)),
    repeating-linear-gradient(45deg,rgba(255,255,255,.015) 0 12px,transparent 12px 24px);
  display:grid;place-items:center;text-align:center;padding:26px;
}
.ph .ico{font-size:30px;opacity:.5;margin-bottom:10px}
.ph b{display:block;font-size:15px;color:#c3d2e8;margin-bottom:5px}
.ph span{font-size:12.5px;color:var(--dim);font-family:var(--mono)}
/* ---------- title slide ---------- */
.hero{position:absolute;inset:0;z-index:0}
.hero img{width:100%;height:100%;object-fit:cover;opacity:.5;filter:saturate(1.05)}
.hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,rgba(6,10,18,.97) 0%,rgba(6,10,18,.82) 42%,rgba(6,10,18,.35) 100%)}
.titlewrap{position:relative;z-index:2;margin:auto 0;max-width:860px}
.brandmark{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.brandmark .dots{display:flex;gap:5px}
.brandmark .dots i{width:11px;height:11px;border-radius:3px;display:block;transform:rotate(45deg)}
.title-sub{font-size:24px;color:#c9d7ec;margin-top:20px;line-height:1.5;max-width:60ch}
.authors{display:flex;gap:11px;margin-top:34px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:9px;padding:9px 17px 9px 10px;border-radius:999px;
  background:rgba(255,255,255,.055);border:1px solid var(--line);font-size:14.5px;font-weight:650}
.pill i{width:25px;height:25px;border-radius:50%;font-style:normal;display:grid;place-items:center;
  font-size:11.5px;font-weight:800;color:#04121a}
/* ---------- section divider ---------- */
.section-slide{justify-content:center}
.secnum{font-size:150px;font-weight:800;letter-spacing:-7px;line-height:.85;
  background:linear-gradient(150deg,var(--c,var(--accent)),rgba(255,255,255,.14));
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
/* ---------- stats strip ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.kpi .v{font-size:31px;font-weight:800;letter-spacing:-1.2px;color:#fff;line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:5px;letter-spacing:.3px}
/* ---------- species bars ---------- */
.sp{display:flex;align-items:center;gap:13px;margin-bottom:11px}
.sp .nm{width:74px;font-size:14.5px;font-weight:700}
.sp .track{flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
.sp .fill{height:100%;border-radius:5px;animation:grow 1.1s cubic-bezier(.22,.9,.3,1) both}
@keyframes grow{from{width:0}}
.sp .vv{width:52px;text-align:right;font-family:var(--mono);font-size:13.5px;color:#dbe6f7}
/* ---------- code ---------- */
pre{background:rgba(3,7,14,.7);border:1px solid var(--line);border-radius:13px;padding:17px 19px;
  font-family:var(--mono);font-size:13.5px;line-height:1.62;color:#c8d6ea;overflow:auto}
.c-key{color:#8b7bff}.c-fn{color:var(--accent)}.c-num{color:var(--sun)}.c-cm{color:#5d6b84;font-style:italic}
/* ---------- overview ---------- */
#overview{position:fixed;inset:0;background:rgba(4,7,13,.97);z-index:80;display:none;
  padding:44px;overflow:auto;backdrop-filter:blur(9px)}
#overview.on{display:block}
#ovGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:15px;max-width:1300px;margin:0 auto}
.ov{border:1px solid var(--line);border-radius:11px;padding:15px;cursor:pointer;background:var(--card);transition:.18s}
.ov:hover{border-color:var(--accent);transform:translateY(-2px);background:rgba(84,224,199,.07)}
.ov .n{font-size:11px;color:var(--dim);font-family:var(--mono);margin-bottom:6px}
.ov .t{font-size:14px;font-weight:650;line-height:1.35}
/* ---------- help ---------- */
#help{position:fixed;right:20px;bottom:18px;z-index:70;font-size:11.5px;color:var(--dim);
  background:rgba(8,13,22,.85);border:1px solid var(--line);border-radius:9px;padding:9px 13px;
  font-family:var(--mono);letter-spacing:.2px;transition:opacity .4s}
#help.fade{opacity:0}
kbd{background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:10.5px}
/* ---------- fsm svg ---------- */
.fsm text{font-family:var(--f);font-size:13px;font-weight:650;fill:#e8f0fb}
.fsm .lbl{font-size:10.5px;fill:#8fa2bd;font-weight:600}
.fsm .node{filter:drop-shadow(0 5px 14px rgba(0,0,0,.5))}
.flow{stroke-dasharray:5 5;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
@media print{
  body{overflow:visible;display:block}
  #stage{transform:none!important;width:100%;height:auto}
  .slide{display:flex!important;position:relative;page-break-after:always;height:var(--slide-h)}
  #help,#overview,#bar{display:none!important}
}
</style>
</head>

<div id="bar"></div>
<div id="stage"></div>

<div id="overview"><div id="ovGrid"></div></div>

</div>

      <span class="pill"><i style="background:linear-gradient(135deg,#ffab2e,#ff6b4d)">T</i>Théo</span>

/* ─────────────────────────  1. PITCH (Enzo)  ───────────────────────── */
{ t:"Introduction & pitch", nav:"1 · Pitch — Enzo", section:true, html:`
  ${who("enzo","E","Enzo")}
  <div class="slide-inner center" style="margin:auto;text-align:center">
    <div class="secnum" style="--c:var(--grazer)">01</div>
    <h2>Introduction &amp; pitch</h2>
    <p class="lead muted" style="margin:14px auto 0">De quoi parle-t-on, et pourquoi c'est intéressant ?</p>
  </div>
  ${foot("Introduction")}`},

{ t:"Le problème", who:"Enzo", nav:"Le pitch", html:`
  ${who("enzo","E","Enzo")}
  <div class="kicker">Le pitch</div>
  <h2>On ne programme pas des comportements.<br>On programme des <em>pressions</em>.</h2>
  <div class="grid g3" style="margin-top:30px">
    <div class="card tint" style="--c:var(--apex)">
      <h3>L'approche classique</h3>
      <p class="small muted">Un arbre de comportement écrit à la main. Chaque réaction est une branche
         que le développeur a prévue. Rien d'inattendu ne peut émerger.</p>
    </div>
    <div class="card tint" style="--c:var(--grazer)">
      <h3>Notre approche</h3>
      <p class="small muted">On code la <strong>faim</strong>, la <strong>fatigue</strong>, la <strong>peur</strong>,
         la <strong>reproduction</strong> — et un génome qui mute. Les stratégies apparaissent seules.</p>
    </div>
    <div class="card tint" style="--c:var(--accent)">
      <h3>Le résultat</h3>
      <p class="small muted">Des troupeaux, des meutes nocturnes, des migrations, des extinctions.
         <strong>Aucun de ces mots n'existe dans le code.</strong></p>
    </div>
  </div>
  <div class="card" style="margin-top:22px;background:rgba(84,224,199,.06);border-color:rgba(84,224,199,.25)">
    <p style="font-size:20.5px;line-height:1.55">« Si on lance la simulation deux fois, on n'obtient pas deux fois
       la même histoire. <em>C'est ça le projet.</em> »</p>
  </div>
  ${foot("Introduction")}`},

{ t:"Ce que vous allez voir", who:"Enzo", nav:"Aperçu", html:`
  ${who("enzo","E","Enzo")}
  <div class="kicker">Aperçu</div>

    <div class="col">
      <div class="kpi"><div class="v">1 km²</div><div class="l">Terrain procédural, 4 biomes</div></div>
      <div class="kpi"><div class="v">~2 000</div><div class="l">Créatures simulées simultanément</div></div>
      <div class="kpi"><div class="v">18</div><div class="l">Gènes évolutifs par individu</div></div>
      <div class="kpi"><div class="v">0</div><div class="l">Comportement scripté à la main</div></div>

  </div>

/* ─────────────────────────  2. STACK (Ariel)  ───────────────────────── */
{ t:"Stack technique", nav:"2 · Stack — Ariel", section:true, html:`
  ${who("ariel","A","Ariel")}
  <div style="margin:auto;text-align:center">
    <div class="secnum" style="--c:var(--darter)">02</div>
    <h2>Stack technique</h2>
    <p class="lead muted" style="margin:14px auto 0">Les choix d'architecture qui rendent l'échelle possible.</p>
  </div>
  ${foot("Stack technique")}`},

{ t:"Pourquoi Mass ECS", who:"Ariel", nav:"Mass ECS", html:`
  ${who("ariel","A","Ariel")}
  <div class="kicker">Architecture</div>
  <h2>Le choix structurant : <em>Mass ECS</em>, pas des Actors</h2>
  <div class="grid g2" style="margin-top:22px">
    <div class="card tint" style="--c:var(--apex)">
      <h3>2 000 Actors Unreal</h3>
      <ul style="--c:var(--apex);margin-top:12px">
        <li>Un <span class="mono">AActor</span> ≈ 1 Ko + surcharge de Tick individuel</li>
        <li>Données éparpillées en mémoire → défauts de cache permanents</li>
        <li>Impraticable au-delà de quelques centaines d'entités</li>
      </ul>
    </div>
    <div class="card tint" style="--c:var(--grazer)">
      <h3>2 000 entités Mass</h3>
      <ul style="--c:var(--grazer);margin-top:12px">
        <li>Données en <strong>tableaux contigus</strong> (SoA) → le cache CPU travaille pour nous</li>
        <li>Traitement par lots, <strong>parallélisable</strong> sur tous les cœurs</li>
        <li>Mesuré : <strong>~2 ms/frame</strong> pour toute la simulation</li>
      </ul>
    </div>
  </div>
  <div class="card" style="margin-top:20px">
    <p class="small"><strong>Conséquence :</strong> le coût CPU n'est plus le facteur limitant — c'est
       le <em>rendu GPU</em> qui borne le frame rate. On l'a mesuré, pas supposé
       (<span class="mono">-nullrhi</span> : 2 ms ⇒ ~500 FPS sans rendu).</p>
  </div>
  ${foot("Stack technique")}`},

{ t:"Le pipeline", who:"Ariel", nav:"Pipeline de processeurs", html:`
  ${who("ariel","A","Ariel")}
  <div class="kicker">Chaîne de traitement</div>
  <h2>11 processeurs, un ordre strict, chaque frame</h2>
  <div style="margin-top:26px;display:flex;flex-direction:column;gap:9px">
    ${[
      ["Grid Update","Reconstruit la grille spatiale (qui est près de qui)","var(--accent)"],
      ["Steering","Perception, machine à états, forces de déplacement","var(--darter)"],
      ["Movement","Intègre vitesse + position, suit le terrain, démarche procédurale","var(--darter)"],
      ["Feeding","Broutage, charognage, chasse et attaques","var(--stalker)"],
      ["Metabolism","Faim, âge, régénération, morts (famine / vieillesse / blessures)","var(--stalker)"],
      ["Reproduction","Sélection du partenaire, croisement + mutation → naissance","var(--grazer)"],
      ["Stats / Render","Agrégation pour l'analyse, rendu instancié par bucket","var(--muted)"]
    ].map(([n,d,c])=>`
      <div style="display:flex;align-items:center;gap:15px">
        <div style="width:9px;height:9px;border-radius:50%;background:${c};flex:none;box-shadow:0 0 11px ${c}"></div>
        <div style="width:158px;font-weight:700;font-size:15.5px;flex:none">${n}</div>
        <div style="flex:1;height:1px;background:var(--line)"></div>
        <div style="flex:2.1;font-size:14.5px;color:var(--muted)">${d}</div>
      </div>`).join("")}
  </div>
  <div class="card" style="margin-top:24px">
    <p class="small"><strong>Contrainte de sûreté :</strong> aucun processeur ne crée ni ne détruit d'entité
       directement. Naissances et morts sont <em>mises en file</em> et exécutées hors du traitement Mass —
       sinon les tableaux bougent sous nos pieds pendant l'itération.</p>
  </div>
  ${foot("Stack technique")}`},

{ t:"Optimisations", who:"Ariel", nav:"Optimisations mesurées", html:`
  ${who("ariel","A","Ariel")}
  <div class="kicker">Performance</div>
  <h2>Optimiser ce qu'on a <em>mesuré</em>, pas ce qu'on imagine</h2>
  <div class="grid g2" style="margin-top:20px">
    <div class="col">
      <div class="card tint" style="--c:var(--accent)">
        <h3>Grille spatiale dense</h3>
        <p class="small muted">Voisinage en O(1) : index plat <span class="mono">iy·Dim+ix</span>,
           zéro hachage. Sans elle : O(n²) = 4 millions de tests par frame.</p>
      </div>
      <div class="card tint" style="--c:var(--accent)">
        <h3>Cache de terrain</h3>
        <p class="small muted">Hauteur et biome pré-calculés une fois en parallèle.
           Chaque requête passe de ~13 octaves de Perlin à une lecture bilinéaire.</p>
      </div>
      <div class="card tint" style="--c:var(--accent)">
        <h3>Culling par distance</h3>
        <p class="small muted">Les instances lointaines (sub-pixel sur 1 km) ne sont ni dessinées
           ni ombrées. Invisible à l'œil, décisif pour le GPU.</p>
      </div>
    </div>
    <div class="col">
      <div class="card" style="flex:1">
        <h3>Le diagnostic qui a tout changé</h3>
        <p class="small muted" style="margin:10px 0 16px">Un logger CSV intégré échantillonne
           frame-time, populations, files d'attente et mémoire toutes les 2 s.</p>
        <pre><span class="c-cm"># Saved/Logs/EvoPerf.csv</span>
t_sim  avg_ms  fps   boids  mem_mb
<span class="c-num">2.0</span>    7.5     133   817    1576
<span class="c-num">30.0</span>   6.8     147   902    1598
<span class="c-num">60.0</span>   6.4     <span class="c-fn">157</span>   975    1621</pre>
        <p class="small muted" style="margin-top:14px">Mémoire <strong>stable</strong> ⇒ pas de fuite.
           Le ralentissement venait de la <em>population qui croît</em>, pas d'un bug.</p>
      </div>
    </div>
  </div>
  ${foot("Stack technique")}`},

{ t:"Le génome", who:"Enzo", nav:"18 gènes", html:`
  ${who("enzo","E","Enzo")}
  <div class="kicker">Le génome</div>
  <h2>18 gènes, un budget fixe — <em>tout est un compromis</em></h2>
  <div class="grid g3" style="margin-top:20px">
    <div class="card tint" style="--c:var(--apex)"><h3>Combat &amp; survie</h3>
      <p class="small muted" style="margin-top:9px">PV · Armure · Dégâts · Régénération · Intimidation · Agressivité</p></div>
    <div class="card tint" style="--c:var(--darter)"><h3>Mobilité &amp; sens</h3>

    <div class="card tint" style="--c:var(--grazer)"><h3>Cycle de vie</h3>
      <p class="small muted" style="margin-top:9px">Faim · Biomasse · Régime · Longévité · Taux de reproduction · Intégration · Taux de mutation</p></div>
  </div>
  <div class="card" style="margin-top:22px">

    <p style="margin-top:11px">Chaque individu dispose d'un <strong>budget de points fixe</strong>.

        <div style="width:31%;background:var(--darter);display:grid;place-items:center;font-size:11px;font-weight:700">Mobilité</div>
        <div style="width:25%;background:var(--grazer);display:grid;place-items:center;font-size:11px;font-weight:700">Cycle de vie</div>
        <div style="width:18%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:11px;font-weight:700">Sens</div>
      </div>
    </div>
  </div>
  ${foot("Génétique")}`},

{ t:"Reproduction", who:"Enzo", nav:"Croisement & mutation", html:`
  ${who("enzo","E","Enzo")}
  <div class="kicker">Transmission</div>
  <h2>Sélection sexuelle, croisement, mutation</h2>
  <div class="grid g3" style="margin-top:24px">

         <strong>distance génétique</strong>.</p></div>
    <div class="card"><div class="num" style="color:var(--darter)">2</div>
      <h3 style="margin-top:9px">Croiser</h3>
      <p class="small muted">L'enfant hérite d'un mélange des deux génomes,
         <strong>toujours sous le même budget</strong>. Aucun enfant ne peut être strictement supérieur à ses parents.</p></div>
    <div class="card"><div class="num" style="color:var(--stalker)">3</div>
      <h3 style="margin-top:9px">Muter</h3>
      <p class="small muted">Une micro-mutation redistribue quelques points. Le <em>taux de mutation
         est lui-même un gène</em> : la vitesse d'évolution évolue.</p></div>
  </div>
  <div class="card" style="margin-top:22px;background:rgba(61,219,110,.06);border-color:rgba(61,219,110,.25)">
    <p style="font-size:19px"><strong>La boucle est fermée :</strong> qui survit se reproduit, qui se reproduit
       transmet, ce qui est transmis mute. <em>Sélection naturelle — sans une seule règle écrite sur « comment évoluer ».</em></p>
  </div>
  ${foot("Génétique")}`},

{ t:"Résultats observés", who:"Enzo", nav:"Évolution observée", html:`
  ${who("enzo","E","Enzo")}
  <div class="kicker">Ce qu'on observe réellement</div>
  <h2>Des stratégies que <em>personne n'a écrites</em></h2>

  ${foot("Génétique")}`},

{ t:"Terrain procédural", who:"Ariel", nav:"Terrain & biomes", html:`

  <h2>1 km² généré par le code — aucune donnée d'artiste</h2>

    ${shot(IMG.world,"Biomes fondus par bruit déformé : prairie, forêt, désert, hautes terres, plages et lacs")}

/* ============================================================
   Moteur de présentation
   ============================================================ */
const stage = document.getElementById('stage');
let cur = 0;

SLIDES.forEach((s,i)=>{
  const d = document.createElement('section');
  d.className = 'slide' + (s.section ? ' section-slide' : '');
  d.dataset.i = i;
  d.innerHTML = s.html;
  stage.appendChild(d);
});
const slides = [...document.querySelectorAll('.slide')];

function fit(){
  const pad = 32;
  const sc = Math.min((innerWidth-pad)/1280, (innerHeight-pad)/720);
  stage.style.transform = `scale(${sc})`;
}
addEventListener('resize', fit); fit();

function show(n, dir){
  cur = Math.max(0, Math.min(SLIDES.length-1, n));
  slides.forEach(s=>s.classList.remove('active'));
  slides[cur].classList.add('active');
  document.getElementById('bar').style.width = ((cur)/(SLIDES.length-1)*100)+'%';
  slides[cur].querySelectorAll('.pgn').forEach(e=>e.textContent = `${cur+1} / ${SLIDES.length}`);
  // relance les animations de barres
  slides[cur].querySelectorAll('.fill').forEach(f=>{const w=f.style.width;f.style.animation='none';f.offsetHeight;f.style.animation='';});
  location.hash = cur;
}
function next(){ show(cur+1) } function prev(){ show(cur-1) }

addEventListener('keydown', e=>{
  const ov = document.getElementById('overview');
  if(e.key==='Escape'){ ov.classList.remove('on'); return; }
  if(['ArrowRight','PageDown',' ','Enter','n'].includes(e.key)){ e.preventDefault(); next(); }
  else if(['ArrowLeft','PageUp','p'].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key==='Home'){ show(0) } else if(e.key==='End'){ show(SLIDES.length-1) }
  else if(e.key.toLowerCase()==='o'){ ov.classList.toggle('on'); }
  else if(e.key.toLowerCase()==='f'){
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  }
  else if(e.key.toLowerCase()==='p'){ print(); }
});
// clic / swipe
addEventListener('click', e=>{
  if(e.target.closest('.ov')) return;
  if(document.getElementById('overview').classList.contains('on')) return;
  (e.clientX > innerWidth*0.35) ? next() : prev();
});
let tx=0;
addEventListener('touchstart',e=>tx=e.changedTouches[0].clientX,{passive:true});
addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx; if(Math.abs(d)>50) d<0?next():prev();},{passive:true});

// plan / overview
const ovGrid = document.getElementById('ovGrid');
SLIDES.forEach((s,i)=>{
  const c = document.createElement('div');
  c.className='ov';
  c.innerHTML = `<div class="n">${String(i+1).padStart(2,'0')}</div><div class="t">${s.nav||s.t}</div>`;
  c.onclick = ()=>{ show(i); document.getElementById('overview').classList.remove('on'); };
  ovGrid.appendChild(c);
});

// masque l'aide après quelques secondes
setTimeout(()=>document.getElementById('help').classList.add('fade'), 5200);
addEventListener('mousemove',()=>{
  const h=document.getElementById('help'); h.classList.remove('fade');
  clearTimeout(h._t); h._t=setTimeout(()=>h.classList.add('fade'),2600);
});

show(parseInt(location.hash.slice(1))||0);
</script>
