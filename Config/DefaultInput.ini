; --- Evoswarm: ZQSD fly controls for the default spectator pawn (AZERTY) ---
+AxisMappings=(AxisName="DefaultPawn_MoveForward",Scale=1.0,Key=Z)
+AxisMappings=(AxisName="DefaultPawn_MoveForward",Scale=-1.0,Key=S)
+AxisMappings=(AxisName="DefaultPawn_MoveRight",Scale=-1.0,Key=Q)
+AxisMappings=(AxisName="DefaultPawn_MoveRight",Scale=1.0,Key=D)
+AxisMappings=(AxisName="DefaultPawn_MoveUp",Scale=1.0,Key=SpaceBar)
+AxisMappings=(AxisName="DefaultPawn_MoveUp",Scale=-1.0,Key=LeftControl)
; The engine hard-codes Q -> MoveUp(-1) for the default pawn (DefaultPawn.cpp), which made Q
; descend on top of strafing. That engine mapping can't be removed from config, but a config
; mapping for the same (axis, key) overrides it: we pin Q -> MoveUp(0) so Q does nothing
; vertically while its MoveRight(-1) strafe stays intact.
+AxisMappings=(AxisName="DefaultPawn_MoveUp",Scale=0.0,Key=Q)
+AxisMappings=(AxisName="DefaultPawn_Turn",Scale=1.0,Key=MouseX)
+AxisMappings=(AxisName="DefaultPawn_LookUp",Scale=-1.0,Key=MouseY)
; Debug visualisation toggle
+ActionMappings=(ActionName="ToggleDebug",Key=B)
