; --- Evoswarm: fly controls for the spectator pawn (AZERTY ZQSD + QWERTY WASD + arrows) ---
; AEvoswarmPawn binds these project-owned Evo_* axes (bAddDefaultMovementBindings=false), so
; they can never collide with the engine's global "DefaultPawn_*" mappings — no more
; "Duplicate mapping" errors, and no need for the old Q -> MoveUp(0) override hack.
+AxisMappings=(AxisName="Evo_MoveForward",Scale=1.0,Key=Z)
+AxisMappings=(AxisName="Evo_MoveForward",Scale=1.0,Key=W)
+AxisMappings=(AxisName="Evo_MoveForward",Scale=1.0,Key=Up)
+AxisMappings=(AxisName="Evo_MoveForward",Scale=-1.0,Key=S)
+AxisMappings=(AxisName="Evo_MoveForward",Scale=-1.0,Key=Down)
+AxisMappings=(AxisName="Evo_MoveRight",Scale=-1.0,Key=Q)
+AxisMappings=(AxisName="Evo_MoveRight",Scale=-1.0,Key=A)
+AxisMappings=(AxisName="Evo_MoveRight",Scale=-1.0,Key=Left)
+AxisMappings=(AxisName="Evo_MoveRight",Scale=1.0,Key=D)
+AxisMappings=(AxisName="Evo_MoveRight",Scale=1.0,Key=Right)
+AxisMappings=(AxisName="Evo_MoveUp",Scale=1.0,Key=SpaceBar)
+AxisMappings=(AxisName="Evo_MoveUp",Scale=-1.0,Key=LeftControl)
+AxisMappings=(AxisName="Evo_Turn",Scale=1.0,Key=MouseX)
+AxisMappings=(AxisName="Evo_LookUp",Scale=-1.0,Key=MouseY)
; Debug visualisation toggle
+ActionMappings=(ActionName="ToggleDebug",Key=B)
; Stats panel (population curves) show/hide
+ActionMappings=(ActionName="ToggleHud",Key=H)
