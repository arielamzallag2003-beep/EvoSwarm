[/Script/UnrealEd.ProjectPackagingSettings]
; The terrain material, the Houdini flora/creature meshes and the whole GoodSky pack are
; loaded at RUNTIME via LoadObject (they are not referenced by the map asset), so the cooker
; cannot see them and a packaged build shipped without them: flat untinted ground, no trees
; or rocks, no sky dome. Force-cook these directories so the packaged game looks like the
; editor.
+DirectoriesToAlwaysCook=(Path="/Game/EvoGen")
+DirectoriesToAlwaysCook=(Path="/Game/GoodSky")
